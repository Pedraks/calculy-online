<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RNC GAMES 360 - Coleção Digital</title>
    <style>
        /* =========================================
           VARIÁVEIS DE TEMA (3 Variações)
           ========================================= */
        
        /* Tema Padrão (Xbox - Escuro e Verde Neon) */
        :root {
            --bg-dark: #0a0e12;
            --bg-card: #151a21;
            --bg-header: #0f1318;
            --primary-color: #00ff00;
            --primary-dark: #004d00;
            --text-light: #ffffff;
            --text-muted: #8b949e;
            --border-color: #262c36;
            --tag-novo: #00ff00;
            --text-yellow: #ffcc00;
        }

        /* Tema 1: Soft (Claro, Harmonioso) */
        [data-theme="soft"] {
            --bg-dark: #f4f6f8;
            --bg-card: #ffffff;
            --bg-header: #ffffff;
            --primary-color: #5b7c99;
            --primary-dark: #3a5368;
            --text-light: #222222;
            --text-muted: #666666;
            --border-color: #d1d5db;
            --tag-novo: #ff9800;
            --text-yellow: #d97706; /* Amarelo mais escuro para leitura no fundo claro */
        }

        /* Tema 3: Agressivo (Vermelho e Escuro) */
        [data-theme="agressivo"] {
            --bg-dark: #050505;
            --bg-card: #121212;
            --bg-header: #0a0000;
            --primary-color: #d90429;
            --primary-dark: #8b0000;
            --text-light: #ffffff;
            --text-muted: #a0a0a0;
            --border-color: #ef233c;
            --tag-novo: #ffb703;
            --text-yellow: #ffb703;
        }

        /* =========================================
           ESTILOS GERAIS
           ========================================= */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            transition: background-color 0.3s, color 0.3s, border-color 0.3s;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* SELETOR DE TEMAS */
        .theme-selector {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            padding: 10px;
            background: var(--bg-header);
            border-bottom: 1px solid var(--border-color);
        }
        .theme-btn {
            padding: 8px 15px;
            cursor: pointer;
            border: 1px solid var(--border-color);
            background: var(--bg-card);
            color: var(--text-light);
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
        }
        .theme-btn:hover {
            border-color: var(--primary-color);
        }

        /* CABEÇALHO */
        header {
            background-color: var(--bg-header);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--border-color);
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }
        .header-icon {
            font-size: 24px;
            cursor: pointer;
            color: var(--text-light);
        }
        .auth-buttons {
            display: flex;
            gap: 10px;
        }
        .btn-outline {
            background: transparent;
            color: var(--text-light);
            border: 1px solid var(--border-color);
            padding: 6px 15px;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
        }
        .btn-solid {
            background: var(--primary-color);
            color: #000;
            border: none;
            padding: 6px 15px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
        }

        /* HERO SECTION E LOGO */
        .hero {
            text-align: center;
            padding: 40px 20px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: radial-gradient(circle at center, rgba(0,255,0,0.03) 0%, var(--bg-dark) 60%);
        }
        
        /* Logo simulando a esfera do Xbox com o X branco */
        .hero-logo-img {
            width: 130px;
            height: 130px;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="%23107C10"/><path d="M 28 25 Q 50 55 72 25 M 28 75 Q 50 45 72 75" stroke="%23ffffff" stroke-width="9" stroke-linecap="round" fill="none"/></svg>') no-repeat center;
            background-size: contain;
            margin-bottom: 15px;
            border-radius: 50%;
            box-shadow: 0 0 25px rgba(0,255,0,0.2);
            border: 3px solid var(--border-color);
            transition: border-color 0.3s;
        }

        [data-theme="soft"] .hero-logo-img { box-shadow: 0 0 25px rgba(91,124,153,0.3); border-color: var(--primary-color); }
        [data-theme="agressivo"] .hero-logo-img { box-shadow: 0 0 25px rgba(217,4,41,0.3); }

        .hero h1 {
            font-size: 34px;
            font-weight: 900;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }
        /* Estilização do Nome: RNC (Branco) GAMES (Amarelo) 360 (Cor do Tema) */
        .title-rnc { color: var(--text-light); }
        .title-games { color: var(--text-yellow); }
        .title-360 { color: var(--primary-color); }

        .hero p {
            color: var(--text-muted);
            font-size: 14px;
            letter-spacing: 3px;
            margin-top: 5px;
            text-transform: uppercase;
        }

        /* BUSCA E FILTROS */
        .filters-section {
            padding: 20px;
            max-width: 1000px;
            margin: 0 auto;
            width: 100%;
        }
        .search-bar {
            width: 100%;
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 14px 20px;
            border-radius: 30px;
            color: var(--text-light);
            font-size: 15px;
            margin-bottom: 20px;
            outline: none;
        }
        .search-bar:focus { border-color: var(--primary-color); }
        
        .categories {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-bottom: 30px;
        }
        .cat-btn {
            background-color: var(--bg-card);
            color: var(--text-muted);
            border: 1px solid var(--border-color);
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            transition: 0.3s;
        }
        .cat-btn.active, .cat-btn:hover {
            background-color: var(--primary-color);
            color: #000;
            border-color: var(--primary-color);
            font-weight: bold;
        }

        /* GRID DE JOGOS */
        main {
            flex: 1;
            padding: 0 20px 40px;
            max-width: 1300px;
            margin: 0 auto;
            width: 100%;
        }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 20px;
        }
        .game-card {
            background-color: var(--bg-card);
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            position: relative;
            border: 1px solid var(--border-color);
            transition: border-color 0.2s, transform 0.2s, box-shadow 0.2s;
        }
        .game-card:hover {
            border-color: var(--primary-color);
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }
        .game-cover {
            background: linear-gradient(to bottom, #2a3441, #0f1318);
            aspect-ratio: 2 / 3;
            display: flex;
            justify-content: center;
            align-items: center;
            border-bottom: 3px solid var(--primary-color);
            position: relative;
        }
        .game-cover-text {
            writing-mode: vertical-rl;
            text-orientation: mixed;
            font-size: 24px;
            font-weight: 900;
            color: rgba(255,255,255,0.2);
            letter-spacing: 5px;
        }
        .tag-novo {
            position: absolute;
            top: 8px;
            left: 8px;
            background-color: var(--tag-novo);
            color: #000;
            font-size: 11px;
            font-weight: bold;
            padding: 3px 8px;
            border-radius: 4px;
        }
        .game-info {
            padding: 12px;
            text-align: center;
        }
        .game-title {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 5px;
            color: var(--text-light);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .game-cat {
            font-size: 12px;
            color: var(--primary-color);
        }

        /* MODAL DE DETALHES (Agora bem mais largo) */
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.85);
            display: none; justify-content: center; align-items: center;
            z-index: 300; padding: 20px;
        }
        .modal-overlay.active { display: flex; }
        .modal-content {
            background: var(--bg-header); 
            padding: 40px; 
            border-radius: 12px;
            max-width: 800px; /* Aba bem maior */
            width: 100%; 
            max-height: 90vh; 
            overflow-y: auto;
            position: relative; 
            border: 2px solid var(--primary-color);
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }
        .close-btn {
            position: absolute; top: 15px; right: 20px; font-size: 30px;
            cursor: pointer; color: var(--text-muted);
            transition: color 0.2s;
        }
        .close-btn:hover { color: var(--primary-color); }
        
        .modal-body {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .m-header h2 { color: var(--text-light); font-size: 28px; margin-bottom: 5px; }
        .m-header .cat { color: var(--primary-color); font-weight: bold; font-size: 14px; text-transform: uppercase; }
        
        .m-details p { color: var(--text-muted); font-size: 16px; margin-bottom: 10px; }
        .m-details strong { color: var(--text-light); }
        
        .m-desc {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid var(--border-color);
            color: var(--text-light);
            font-size: 16px;
            line-height: 1.6;
        }

        .btn-wa-modal {
            display: block; width: 100%; padding: 15px;
            background-color: #25D366; color: #fff; text-align: center;
            border-radius: 8px; font-weight: bold; margin-top: 30px;
            border: none; cursor: pointer; font-size: 16px;
            transition: transform 0.2s;
        }
        .btn-wa-modal:hover { transform: scale(1.02); }

        /* FAB WHATSAPP */
        .fab {
            position: fixed; bottom: 25px; right: 25px;
            background-color: #25D366; color: white;
            width: 60px; height: 60px; border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            font-size: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            cursor: pointer; z-index: 150; text-decoration: none;
            transition: transform 0.2s;
        }
        .fab:hover { transform: scale(1.1); }

        /* MENUS LATERAIS */
        .side-menu {
            position: fixed; top: 0; bottom: 0; width: 300px; max-width: 80vw;
            background-color: var(--bg-header); border-right: 1px solid var(--border-color);
            padding: 30px 20px; transform: translateX(-100%); transition: 0.3s ease;
            z-index: 200; overflow-y: auto; box-shadow: 5px 0 20px rgba(0,0,0,0.7);
        }
        .side-menu.right { left: auto; right: 0; border-right: none; border-left: 1px solid var(--border-color); transform: translateX(100%); }
        .side-menu.open { transform: translateX(0); }
        .side-menu h3 { color: var(--text-light); border-bottom: 2px solid var(--primary-color); padding-bottom: 10px; margin-bottom: 20px; }
        .side-menu ul { list-style: none; }
        .side-menu li { margin-bottom: 15px; font-size: 15px; color: var(--text-muted); cursor: pointer; }
        .side-menu li:hover { color: var(--primary-color); }

        /* RESPONSIVIDADE */
        @media (max-width: 600px) {
            .grid-container { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
            .hero h1 { font-size: 26px; }
            .modal-content { padding: 25px; }
        }
    </style>
</head>
<body>

    <!-- SELETOR DE TEMAS -->
    <div class="theme-selector">
        <button class="theme-btn" onclick="setTheme('xbox')">TEMA: XBOX (Padrão)</button>
        <button class="theme-btn" onclick="setTheme('soft')">TEMA: SOFT (Claro)</button>
        <button class="theme-btn" onclick="setTheme('agressivo')">TEMA: AGRESSIVO</button>
    </div>

    <!-- CABEÇALHO -->
    <header>
        <div class="header-icon" onclick="toggleMenu('infoMenu')">☰</div>
        <div class="auth-buttons">
            <button class="btn-outline">Entrar</button>
            <button class="btn-solid">Cadastrar</button>
        </div>
    </header>

    <!-- MENUS LATERAIS -->
    <aside id="infoMenu" class="side-menu">
        <span class="close-btn" style="top: 10px; right: 15px;" onclick="toggleMenu('infoMenu')">×</span>
        <h3>Institucional</h3>
        <ul>
            <li>Sobre a RNC GAMES</li>
            <li>Horários de Atendimento</li>
            <li>Regiões Atendidas</li>
            <li>Suporte Técnico</li>
            <li>Política de Devolução</li>
        </ul>
    </aside>

    <!-- HERO SECTION (Logo e Nome) -->
    <section class="hero">
        <div class="hero-logo-img"></div>
        <h1>
            <span class="title-rnc">RNC</span> 
            <span class="title-games">GAMES</span> 
            <span class="title-360">360</span>
        </h1>
        <p>A Maior Coleção Digital</p>
    </section>

    <!-- BUSCA E FILTROS -->
    <section class="filters-section">
        <input type="text" id="searchInput" class="search-bar" placeholder="🔍 Buscar por título do jogo..." onkeyup="filterGames()">
        
        <div class="categories" id="categoryFilters">
            <button class="cat-btn active" onclick="setCategory('Todos')">Todos</button>
            <button class="cat-btn" onclick="setCategory('Ação')">Ação</button>
            <button class="cat-btn" onclick="setCategory('Aventura')">Aventura</button>
            <button class="cat-btn" onclick="setCategory('Esportes')">Esportes</button>
            <button class="cat-btn" onclick="setCategory('FPS')">FPS</button>
            <button class="cat-btn" onclick="setCategory('Luta')">Luta</button>
            <button class="cat-btn" onclick="setCategory('Terror')">Terror</button>
        </div>
    </section>

    <!-- GRID DE JOGOS -->
    <main>
        <div class="grid-container" id="gamesGrid">
            <!-- Injetado pelo JS -->
        </div>
    </main>

    <!-- MODAL DE DETALHES -->
    <div class="modal-overlay" id="gameModal" onclick="closeModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <span class="close-btn" onclick="document.getElementById('gameModal').classList.remove('active')">×</span>
            
            <div class="modal-body">
                <div class="m-header">
                    <h2 id="m-title">Nome do Jogo</h2>
                    <span class="cat" id="m-cat">Categoria</span>
                </div>
                
                <div class="m-details">
                    <p><strong>Lançamento Original:</strong> <span id="m-date"></span></p>
                    <p><strong>Formato:</strong> <span id="m-status"></span></p>
                    <p><strong>Valor:</strong> <span id="m-price" style="font-size: 22px; color: var(--primary-color); font-weight: bold;"></span></p>
                </div>

                <div class="m-desc" id="m-desc">
                    <!-- Descrição completa do jogo vai aqui -->
                </div>

                <button class="btn-wa-modal" onclick="alert('Redirecionando para o WhatsApp do vendedor...')">
                    Dúvidas? Comprar via WhatsApp
                </button>
            </div>
        </div>
    </div>

    <!-- FAB WHATSAPP -->
    <a href="#" class="fab" title="Atendimento WhatsApp">
        💬
    </a>

    <!-- LÓGICA JAVASCRIPT -->
    <script>
        // Função de Troca de Tema
        function setTheme(theme) {
            if (theme === 'xbox') {
                document.documentElement.removeAttribute('data-theme');
            } else {
                document.documentElement.setAttribute('data-theme', theme);
            }
        }

        // Menu toggle
        function toggleMenu(id) {
            document.getElementById(id).classList.toggle('open');
        }

        // Base de Dados Completa com Descrições Detalhadas
        const games = [
            { 
                title: "PES 2026 (Atualizado Agosto)", 
                cat: "Esportes", 
                price: "R$ 30,00", 
                date: "2026",
                desc: "Viva a emoção do futebol com o patch mais recente e atualizado do mercado! O PES 2026 traz todas as transferências do fechamento da janela europeia de agosto, novos uniformes, faces realistas em HD e estádios exclusivos. Ideal para jogar Master League ou campeonatos com os amigos. Compatível com consoles destravados.", 
                tag: "Novo" 
            },
            { 
                title: "Crysis 1 (PT-BR)", 
                cat: "FPS", 
                price: "R$ 25,00", 
                date: "2007",
                desc: "O jogo que redefiniu os gráficos de uma geração inteira está de volta. Vista a Nanosuit e utilize habilidades de força, velocidade, armadura e camuflagem para sobreviver a uma ilha dominada por alienígenas e mercenários. Esta versão conta com dublagem e legendas totalmente em Português do Brasil, proporcionando máxima imersão.", 
                tag: "Novo" 
            },
            { 
                title: "Split/Second", 
                cat: "Ação", 
                price: "R$ 40,00", 
                date: "2010",
                desc: "Esqueça as corridas tradicionais. Em Split/Second, você participa de um reality show de TV onde o objetivo é destruir o cenário para eliminar seus oponentes. Derrube aviões, exploda pontes e altere o traçado da pista em tempo real enquanto pilota em alta velocidade. Diversão garantida no modo tela dividida.", 
                tag: "" 
            },
            { 
                title: "Devil May Cry 4 (PT-BR)", 
                cat: "Luta", 
                price: "R$ 35,00", 
                date: "2008",
                desc: "Mergulhe no universo gótico e frenético de Devil May Cry controlando Nero, um jovem cavaleiro com um braço demoníaco, e o lendário caçador de demônios, Dante. Faça combos aéreos absurdos, colete orbs e destrua chefes gigantescos ao som de muito heavy metal. Versão legendada em PT-BR.", 
                tag: "Novo" 
            },
            { 
                title: "Mortal Kombat 9 (Mods)", 
                cat: "Luta", 
                price: "R$ 45,00", 
                date: "2011",
                desc: "A versão definitiva do clássico moderno que reiniciou a franquia. Este pacote especial (Modificado) inclui todos os personagens de DLC (Shao Kahn, Kintaro, Goro e Motaro jogáveis), skins clássicas e modo história completo. O combate 2D sangrento e os Fatalities clássicos nunca foram tão brutais.", 
                tag: "" 
            },
            { 
                title: "Red Dead Redemption", 
                cat: "Aventura", 
                price: "R$ 60,00", 
                date: "2010",
                desc: "A obra-prima da Rockstar Games que te coloca na pele de John Marston, um ex-fora da lei forçado a caçar seus antigos parceiros de gangue pelo governo federal. Explore um vasto mundo aberto no faroeste. Acompanha a expansão Undead Nightmare, transformando o velho oeste num apocalipse zumbi.", 
                tag: "" 
            },
            { 
                title: "Alien Isolation (Dublado)", 
                cat: "Terror", 
                price: "R$ 50,00", 
                date: "2014",
                desc: "Descubra o verdadeiro significado de medo. Quinze anos após os eventos do primeiro filme Alien, Amanda Ripley, filha de Ellen Ripley, entra em uma batalha desesperada por sobrevivência contra um Xenomorfo letal que aprende os seus movimentos. Jogo 100% dublado em Português.", 
                tag: "Novo" 
            },
            { 
                title: "Alan Wake (Legendado)", 
                cat: "Terror", 
                price: "R$ 30,00", 
                date: "2010",
                desc: "Um thriller de ação psicológica onde a luz é sua única arma. O escritor Alan Wake vai para a pacata cidade de Bright Falls procurar sua esposa desaparecida, mas logo percebe que as páginas de um livro de terror que ele não lembra de ter escrito estão ganhando vida durante a noite.", 
                tag: "" 
            },
            { 
                title: "007 GoldenEye Reloaded", 
                cat: "Ação", 
                price: "R$ 35,00", 
                date: "2011",
                desc: "A recriação moderna do maior clássico de tiro do Nintendo 64. Jogabilidade fluida, gráficos melhorados e a presença de Daniel Craig como James Bond. Uma campanha eletrizante de espionagem e um modo multiplayer local focado na nostalgia para jogar com até 4 amigos na mesma tela.", 
                tag: "Novo" 
            },
            { 
                title: "Disney Pixar: UP", 
                cat: "Aventura", 
                price: "R$ 20,00", 
                date: "2009",
                desc: "Junte-se ao ranzinza Carl Fredricksen e ao jovem explorador Russell em uma jornada maluca até o Paraíso das Cachoeiras. Um jogo leve de plataforma, com puzzles divertidos e cooperação, ideal para jogar com crianças ou para relaxar relembrando um dos filmes mais emocionantes da Pixar.", 
                tag: "Novo" 
            }
        ];

        let currentCategory = 'Todos';

        // Renderizar Grid
        function renderGames(lista) {
            const grid = document.getElementById('gamesGrid');
            grid.innerHTML = ''; 
            
            if(lista.length === 0) {
                grid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: var(--text-muted); font-size: 18px; margin-top: 20px;">Nenhum jogo encontrado para esta busca.</p>';
                return;
            }

            lista.forEach((game, index) => {
                const tagHtml = game.tag ? `<div class="tag-novo">${game.tag}</div>` : '';
                const card = document.createElement('div');
                card.className = 'game-card';
                
                // Mapear o index real no array principal para o modal sempre abrir o jogo certo
                const originalIndex = games.indexOf(game); 
                card.onclick = () => openModal(originalIndex);
                
                card.innerHTML = `
                    <div class="game-cover">
                        ${tagHtml}
                        <span class="game-cover-text">XBOX 360</span>
                    </div>
                    <div class="game-info">
                        <div class="game-title" title="${game.title}">${game.title}</div>
                        <div class="game-cat">${game.cat}</div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // Lógica de Filtro por Categoria
        function setCategory(cat) {
            currentCategory = cat;
            
            document.querySelectorAll('.cat-btn').forEach(btn => {
                btn.classList.remove('active');
                if(btn.innerText.includes(cat) || (cat === 'Todos' && btn.innerText === 'Todos')) {
                    btn.classList.add('active');
                }
            });

            applyFilters();
        }

        // Lógica de Busca por Texto
        function filterGames() {
            applyFilters();
        }

        // Aplica Texto + Categoria juntos
        function applyFilters() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            
            const filtered = games.filter(game => {
                const matchName = game.title.toLowerCase().includes(query);
                const matchCat = currentCategory === 'Todos' || game.cat === currentCategory;
                return matchName && matchCat;
            });

            renderGames(filtered);
        }

        // Lógica do Modal
        function openModal(index) {
            const game = games[index];
            document.getElementById('m-title').innerText = game.title;
            document.getElementById('m-cat').innerText = game.cat;
            document.getElementById('m-date').innerText = game.date;
            document.getElementById('m-status').innerText = "Mídia Digital / Envio Imediato";
            document.getElementById('m-price').innerText = game.price;
            document.getElementById('m-desc').innerText = game.desc;
            
            document.getElementById('gameModal').classList.add('active');
            document.body.style.overflow = 'hidden'; // Evita rolar a página por trás do modal
        }

        function closeModal(event) {
            if(event.target.id === 'gameModal' || event.target.className === 'close-btn') {
                document.getElementById('gameModal').classList.remove('active');
                document.body.style.overflow = 'auto'; // Restaura rolagem
            }
        }

        // Iniciar com todos os jogos carregados
        renderGames(games);
    </script>
</body>
</html>
